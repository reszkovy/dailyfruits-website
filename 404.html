// ─── GA4 Event Tracking via dataLayer ───
window.dataLayer = window.dataLayer || [];
document.addEventListener('DOMContentLoaded', function() {
    // Track CTA clicks
    document.querySelectorAll('a[href*="zapytanie"], .btn-red-solid, .btn-green, .cta-primary').forEach(function(el) {
        el.addEventListener('click', function() {
            dataLayer.push({ event: 'cta_click', cta_text: this.textContent.trim().slice(0,50), cta_url: this.href, page: location.pathname });
        });
    });
    // Track phone clicks
    document.querySelectorAll('a[href^="tel:"]').forEach(function(el) {
        el.addEventListener('click', function() {
            dataLayer.push({ event: 'phone_click', page: location.pathname });
        });
    });
    // Track email clicks
    document.querySelectorAll('a[href^="mailto:"]').forEach(function(el) {
        el.addEventListener('click', function() {
            dataLayer.push({ event: 'email_click', page: location.pathname });
        });
    });
    // Track scroll depth (25%, 50%, 75%, 100%)
    var scrollMarks = [25, 50, 75, 100], fired = {};
    window.addEventListener('scroll', function() {
        var pct = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
        scrollMarks.forEach(function(m) { if (pct >= m && !fired[m]) { fired[m] = true; dataLayer.push({ event: 'scroll_depth', depth: m, page: location.pathname }); }});
    }, { passive: true });
    // Track FAQ opens
    document.querySelectorAll('.faq-q, details summary').forEach(function(el) {
        el.addEventListener('click', function() {
            dataLayer.push({ event: 'faq_click', question: this.textContent.trim().slice(0,80), page: location.pathname });
        });
    });
    // Track calculator interaction
    var calcSliders = document.querySelectorAll('.calc-slider');
    if (calcSliders.length) {
        var calcFired = false;
        calcSliders.forEach(function(s) { s.addEventListener('input', function() { if (!calcFired) { calcFired = true; dataLayer.push({ event: 'calculator_used', page: location.pathname }); }});});
    }
});
