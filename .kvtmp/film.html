<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Achiko';src:url('../Achiko.woff2') format('woff2')}
*{margin:0;box-sizing:border-box}
html,body{height:100%}
.k{position:relative;width:100vw;height:100vh;overflow:hidden;background:#0f2a1a;
   font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.k img.tlo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:74% 50%;transform:scale(1.18);transform-origin:70% 50%}
.szkl{position:absolute;inset:0;background:
  linear-gradient(to right, #0f2a1a 0%, #0f2a1a 34%, rgba(15,42,26,.92) 48%, rgba(15,42,26,.30) 74%, rgba(15,42,26,.10) 88%, rgba(15,42,26,.45) 100%)}
.dol{position:absolute;inset:0;background:linear-gradient(to top, rgba(15,42,26,.75), transparent 46%)}
.logo{position:absolute;top:6.4%;left:5.2%;height:12.5%;width:auto;display:block}
.tresc{position:absolute;left:5.2%;bottom:9%;max-width:52%}
.eyebrow{display:inline-block;background:#E43020;color:#fff;font-size:1.55vh;font-weight:900;
  letter-spacing:.16em;text-transform:uppercase;padding:.9vh 1.8vh;border-radius:99px;margin-bottom:2.4vh}
h1{font-family:'Achiko',system-ui;font-weight:400;color:#8DC63F;font-size:8.6vh;line-height:.94;margin:0 0 1.6vh}
p{color:rgba(255,249,224,.9);font-size:2.5vh;line-height:1.4;font-weight:600;max-width:30ch}
</style></head><body>
<div class="k">
  <img class="tlo" src="../film-dostawy.webp" alt="">
  <div class="szkl"></div><div class="dol"></div>
  <img class="logo" src="../animacja_11-lime.svg" alt="">
  <div class="tresc">
    <span class="eyebrow">Film, 2 minuty</span>
    <h1>Zobacz jak<br>dowozimy</h1>
    <p>Nasi ludzie, nasze skrzynki, prawdziwe dostawy do firm w całej Polsce.</p>
  </div>
</div>
</body></html>
